<main>

<section class="page-header">

<div class="container">

    DENUNCIANTE
</span>

<h1>
    Acompanhar denúncia
</h1>

<p>
    Digite o protocolo recebido no momento do registro.
</p>

</div>

<section class="form-section">

<div class="container">

<div class="form-card small-card">

<form id="consultaForm">

<div class="form-group">

<label for="protocolo">
    Número do protocolo
</label>

<input
    type="text"
    id="protocolo"
    placeholder="Ex.: DEN-123456"
    required
>

</div>


<button
    type="submit"
    class="btn btn-primary btn-full"
>
    Consultar denúncia
</button>

</form>


<div
    id="resultadoConsulta"
    class="hidden"
></div>

</div>
